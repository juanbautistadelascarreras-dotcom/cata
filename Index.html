<!doctype html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --papel:#FBF4E6; --papel-2:#F1E3C6; --carta:#FFFDF8; --tinta:#2A1A0F; --tinta-2:#6E5646;
  --manteca:#E3A11B; --manteca-suave:#F9E3A8; --espresso:#6B3E22; --leche:#EAD6B3;
  --azulejo:#1F4F8C; --azulejo-suave:#DCE7F5; --linea:rgba(42,26,15,.14);
  --sombra:0 8px 22px rgba(70,40,15,.13); --mal:#B3261E; --ok:#2F8A52; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --papel:#17110C; --papel-2:#261C14; --carta:#221911; --tinta:#F6EAD7; --tinta-2:#C3AC93;
    --manteca:#F2B83A; --manteca-suave:#4E3B14; --espresso:#E3B68C; --leche:#4A3524;
    --azulejo:#8FB5EA; --azulejo-suave:#1B2A40; --linea:rgba(246,234,215,.14);
    --sombra:0 8px 22px rgba(0,0,0,.45); --mal:#F2877F; --ok:#6BCB8E; color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.display{font-family:"Abril Fatface",Georgia,serif;font-weight:400;letter-spacing:.01em}
:focus-visible{outline:3px solid var(--azulejo);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}

/* ---------- Encabezado con taza humeante ---------- */
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:18px 0 6px}
header.top h1{margin:0;font-size:clamp(2rem,9vw,2.6rem);line-height:1.02}
.hola{margin-top:8px;border:0;border-radius:99px;padding:5px 12px;background:var(--papel-2);font-weight:700;font-size:.88rem}
.cup{width:74px;flex:none}
.cup .steam{fill:none;stroke:var(--tinta-2);stroke-width:3;stroke-linecap:round;opacity:0;animation:steam 3.2s ease-in-out infinite}
.cup .steam:nth-of-type(2){animation-delay:1s}
.cup .steam:nth-of-type(3){animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.6}100%{opacity:0;transform:translateY(-10px)}}

main{padding-bottom:130px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}

.cta{margin:14px 0 8px;width:100%;border:0;border-radius:28px;padding:22px 20px;background:var(--tinta);color:var(--papel);text-align:left;display:flex;align-items:center;gap:16px;box-shadow:var(--sombra)}
.cta .ico{font-size:52px;display:inline-block;animation:rock 2.6s ease-in-out infinite}
.cta b{display:block;font-size:1.35rem;line-height:1.1}
.cta span{opacity:.75;font-size:.92rem}
@keyframes rock{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg) scale(1.06)}}
.draft{margin:10px 0;padding:12px 14px;border-radius:18px;background:var(--manteca-suave);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.92rem}
.draft .row{display:flex;gap:6px}

.champ{margin:14px 0 6px;padding:20px 20px 18px;border-radius:26px;background:var(--manteca);color:#2A1A0F;position:relative;overflow:hidden;border:0;width:100%;text-align:left;display:block}
.champ::after{content:"🥐";position:absolute;right:-18px;bottom:-30px;font-size:130px;opacity:.22;transform:rotate(-18deg);pointer-events:none}
.champ small{font-weight:600;opacity:.8}
.champ .n{font-size:1.4rem;font-weight:800;line-height:1.15;margin:4px 0 2px;max-width:75%}
.champ .big{font-size:4rem;line-height:.9;margin-top:10px}
.champ .verd{font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.stat{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:10px 12px}
.stat b{display:block;font-size:1.5rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--tinta-2)}
.duel{background:var(--carta);border:1px solid var(--linea);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:.92rem}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--linea);background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:.9rem}
.chip.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.chip.city.on{background:var(--azulejo);border-color:var(--azulejo);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.visit{display:grid;grid-template-columns:auto 58px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--carta);border:1px solid var(--linea);border-radius:20px;padding:10px 14px 10px 10px}
.visit:active{transform:scale(.98)}
.rank{font-weight:800;color:var(--tinta-2);font-size:.85rem;width:22px;text-align:center}
.thumb{width:58px;height:58px;border-radius:16px;background:var(--papel-2) center/cover no-repeat;display:grid;place-items:center;font-size:28px}
.v-name{font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.v-meta{font-size:.8rem;color:var(--tinta-2);margin-top:2px}
.v-bars{display:flex;gap:10px;font-size:.85rem;margin-top:3px;font-weight:600}
.v-score{text-align:right}
.v-score b{font-size:1.9rem;line-height:1;display:block}
.v-score span{font-size:.72rem;color:var(--tinta-2);font-weight:600}
.empty{text-align:center;padding:30px 16px;color:var(--tinta-2)}

#leaf{height:64vh;min-height:340px;border-radius:26px;border:1px solid var(--linea);overflow:hidden;background:var(--papel-2)}
.mk-wrap{background:transparent;border:0}
.mk{width:44px;height:44px;border-radius:50%;background:var(--c);display:grid;place-items:center;font-size:21px;box-shadow:0 3px 10px rgba(0,0,0,.3);border:3px solid #fff;position:relative;animation:drop .5s cubic-bezier(.3,1.6,.5,1)}
.mk b{position:absolute;top:-8px;right:-12px;background:#2A1A0F;color:#fff;font:800 11px/1 "Figtree",sans-serif;padding:4px 5px;border-radius:99px}
@keyframes drop{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
.pop{font-family:"Figtree",sans-serif;min-width:170px}
.pop b{font-size:1rem;display:block}
.pop button{margin-top:8px;width:100%}
.note-muted{font-size:.85rem;color:var(--tinta-2)}

.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--tinta);color:var(--papel);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.soft{background:var(--papel-2);color:var(--tinta)}
.btn.blue{background:var(--azulejo);color:#fff}
.btn.gold{background:var(--manteca);color:#2A1A0F}
.btn.link{background:transparent;color:var(--tinta-2);padding-left:0;padding-right:0}
.btn.danger{background:transparent;color:var(--mal);padding-left:0}
.btn.big{width:100%;padding:16px;font-size:1.08rem;border-radius:18px}
.btn:disabled{opacity:.4}
input[type=text],textarea{width:100%;border:1.5px solid var(--linea);background:var(--carta);border-radius:16px;padding:13px 14px;outline:none;font-size:1rem}
input:focus,textarea:focus{border-color:var(--azulejo)}
textarea{min-height:90px;resize:vertical}

/* ---------- Barra inferior ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--papel);border-top:1px solid var(--linea);z-index:1000}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
nav.tabs .tab{border:0;background:transparent;padding:9px 0 10px;font-size:.78rem;font-weight:600;color:var(--tinta-2);display:flex;flex-direction:column;align-items:center}
nav.tabs .tab .ic{font-size:1.35rem;line-height:1.2;filter:grayscale(1);opacity:.7;transition:transform .2s}
nav.tabs .tab.on{color:var(--tinta)}
nav.tabs .tab.on .ic{filter:none;opacity:1;transform:translateY(-2px) scale(1.1)}
.catar{margin:-26px 10px 8px;width:72px;height:72px;border-radius:50%;border:5px solid var(--papel);background:var(--manteca);font-size:34px;box-shadow:var(--sombra);display:grid;place-items:center}
.catar:active{transform:scale(.92)}

/* ---------- Pantalla completa (cata y PIN) ---------- */
.full{position:fixed;inset:0;z-index:2000;background:var(--papel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wbar{display:flex;align-items:center;gap:12px;padding:12px 18px 6px;max-width:560px;width:100%;margin:0 auto}
.xbtn{border:0;background:var(--papel-2);width:38px;height:38px;border-radius:50%;font-size:1.1rem;flex:none}
.track{flex:1;height:10px;border-radius:99px;background:var(--papel-2);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--manteca);transition:width .45s cubic-bezier(.3,1.3,.5,1)}
.track em{position:absolute;top:50%;font-style:normal;font-size:22px;transform:translate(-50%,-55%);transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.stage{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scr{max-width:560px;margin:0 auto;padding:10px 20px 24px;animation:inR .38s cubic-bezier(.2,.9,.3,1)}
.scr.back{animation-name:inL}
@keyframes inR{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.q-group{display:inline-block;font-weight:800;font-size:.82rem;padding:4px 12px;border-radius:99px;margin-top:6px}
.q-group.medialuna{background:var(--manteca-suave)}
.q-group.cafe{background:var(--leche)}
.q-group.experiencia{background:var(--azulejo-suave)}
.q-icon{font-size:72px;line-height:1;margin:14px 0 6px;display:inline-block;animation:bounceIn .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes bounceIn{0%{transform:scale(.3) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.q-title{margin:0;font-size:clamp(1.7rem,7.5vw,2.2rem);line-height:1.08}
.q-tip{color:var(--tinta-2);margin:8px 0 16px;font-size:.98rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;border:2px solid var(--linea);background:var(--carta);border-radius:18px;padding:10px 16px 10px 10px;text-align:left;transition:transform .15s,opacity .2s,border-color .2s,background .2s}
.opt .e{font-size:30px;text-align:center}
.opt .w{font-weight:800;font-size:1.05rem}
.opt .n{font-family:"Abril Fatface",Georgia,serif;font-size:1.5rem;color:var(--tinta-2)}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--manteca);background:var(--manteca-suave);animation:pick .4s cubic-bezier(.3,1.8,.5,1)}
.opts.done .opt:not(.sel){opacity:.35}
@keyframes pick{40%{transform:scale(1.04)}100%{transform:none}}
.wfoot{display:flex;justify-content:space-between;align-items:center;max-width:560px;width:100%;margin:0 auto;padding:8px 20px 12px}
.float{position:fixed;pointer-events:none;font-size:26px;z-index:3000;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-120px) scale(1.4);opacity:0}}

.seg{display:inline-flex;flex-wrap:wrap;background:var(--papel-2);border-radius:14px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:11px;font-weight:700}
.seg button.on{background:var(--carta);box-shadow:var(--sombra)}
.field{margin:14px 0}
.field > label{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.results{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.results button{border:1.5px solid var(--linea);background:var(--carta);border-radius:14px;padding:10px 12px;text-align:left;font-size:.92rem}
.ok{color:var(--ok);font-weight:700}
.hint{font-size:.85rem;color:var(--tinta-2);margin-top:6px}
.or{display:flex;align-items:center;gap:10px;color:var(--tinta-2);font-size:.85rem;margin:12px 0 8px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--linea)}
.photos{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.ph{position:relative;flex:none;width:84px;height:84px;border-radius:16px;background:var(--papel-2) center/cover}
.ph button{position:absolute;top:4px;right:4px;border:0;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem}
.ph.add{display:grid;place-items:center;border:2px dashed var(--linea);background:transparent;font-size:.8rem;font-weight:700;color:var(--tinta-2);text-align:center;line-height:1.2}
.volv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.volv button{border:2px solid var(--linea);background:var(--carta);border-radius:18px;padding:12px 6px;font-weight:800;font-size:.9rem;display:flex;flex-direction:column;align-items:center;gap:4px}
.volv button span{font-size:34px;line-height:1}
.volv button.sel{border-color:var(--manteca);background:var(--manteca-suave);animation:pick .4s cubic-bezier(.3,1.8,.5,1)}

.turn{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.turn .who{font-size:clamp(3rem,16vw,4.6rem);line-height:1;animation:bounceIn .7s cubic-bezier(.3,1.7,.5,1)}
.saving{min-height:65vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--tinta-2);font-weight:700}
.mug{width:90px;height:90px;border-radius:14px 14px 30px 30px;border:5px solid var(--tinta);position:relative;overflow:hidden}
.mug::after{content:"";position:absolute;left:0;right:0;bottom:0;background:var(--leche);animation:fill 1.6s ease-in-out infinite}
@keyframes fill{0%{height:0}70%,100%{height:100%}}

.verdict{text-align:center;padding-top:20px}
.verdict small{font-weight:800;color:var(--tinta-2)}
.bigscore{font-size:clamp(5rem,28vw,7.5rem);line-height:.95;margin:6px 0 0}
.vword{display:inline-block;background:var(--manteca);color:#2A1A0F;font-weight:800;padding:6px 16px;border-radius:99px;transform:rotate(-4deg) scale(0);animation:stampIn .5s .9s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes stampIn{to{transform:rotate(-4deg) scale(1)}}
.bars{margin:24px 0 10px;text-align:left;display:flex;flex-direction:column;gap:12px}
.bar .l{display:flex;justify-content:space-between;font-weight:700;margin-bottom:4px}
.bar .t{height:12px;border-radius:99px;background:var(--papel-2);overflow:hidden}
.bar .t i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.bar.medialuna i{background:var(--manteca)} .bar.cafe i{background:var(--espresso)} .bar.experiencia i{background:var(--azulejo)}
.pareja{margin-top:14px;padding:12px;border-radius:18px;background:var(--carta);border:1px solid var(--linea);font-weight:700}

/* PIN */
.pinbox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
.pinbox .ico{font-size:64px;animation:rock 2.6s ease-in-out infinite}
.dotsp{display:flex;gap:12px;min-height:22px}
.dotsp i{width:16px;height:16px;border-radius:50%;background:var(--papel-2);transition:background .15s,transform .15s}
.dotsp i.on{background:var(--manteca);transform:scale(1.15)}
.dotsp.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:64px;border-radius:20px;border:0;background:var(--carta);box-shadow:var(--sombra);font-size:1.5rem;font-weight:700}
.pad button:active{transform:scale(.94)}

/* Hoja inferior (ficha) */
.sheet{position:fixed;inset:0;z-index:1500;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(20,12,6,.45);animation:fade .2s ease}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:600px;margin:0 auto;max-height:calc(100% - 24px);background:var(--papel);border-radius:28px 28px 0 0;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.3,1.1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--linea);margin:8px auto 0}
.phead{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 4px}
.pbody{overflow-y:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px 12px;padding:0 18px}
.gallery img{flex:none;width:86%;height:230px;object-fit:cover;border-radius:22px;scroll-snap-align:center;background:var(--papel-2)}
.d-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.d-top h2{margin:0;font-size:1.7rem;line-height:1.05}
.seal{flex:none;width:92px;height:92px;border-radius:50%;background:var(--manteca);color:#2A1A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.seal b{font-size:2.1rem;line-height:1}
.seal span{font-size:.62rem;font-weight:800;text-align:center;line-height:1.1;max-width:74px}
.d-meta{color:var(--tinta-2);font-size:.9rem;margin:6px 0 4px}
.cmp{width:100%;border-collapse:collapse;margin-top:8px}
.cmp th,.cmp td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--linea);font-size:.92rem}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{font-size:.8rem;color:var(--tinta-2);font-weight:700}
.cmp td.g{font-weight:700}
.cmp tr.sub td{font-size:.82rem;color:var(--tinta-2);padding:5px 4px}
.cmp tr.sub td:first-child{padding-left:14px}
.win{color:var(--ok)}
details summary{cursor:pointer;font-weight:700;font-size:.9rem;margin:10px 0 4px;color:var(--azulejo)}
.notes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bubble{background:var(--carta);border:1px solid var(--linea);border-radius:18px 18px 18px 6px;padding:10px 14px;white-space:pre-wrap}
.bubble small{display:block;font-weight:700;color:var(--tinta-2);margin-bottom:2px;white-space:normal}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.confetti{position:fixed;top:-40px;z-index:3000;pointer-events:none;font-size:28px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:10px 16px;border-radius:14px;font-weight:600;font-size:.92rem;z-index:4000;max-width:90%;text-align:center;display:none}
.toast.show{display:block;animation:fade .2s}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .vword{transform:rotate(-4deg)}
}

/* ====== Edición 4 ====== */
nav.tabs .in{grid-template-columns:1fr 1fr auto 1fr 1fr}
.hrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.sndbtn{border:0;background:var(--papel-2);width:34px;height:34px;border-radius:50%;font-size:1rem}
.banner{margin:10px 0;padding:12px 14px;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.92rem;width:100%;border:0;text-align:left}
.banner.gift{background:var(--azulejo);color:#fff;animation:wiggle 2.4s ease-in-out infinite}
.banner.gift b{font-weight:800}
@keyframes wiggle{0%,90%,100%{transform:none}93%{transform:rotate(-1.5deg)}96%{transform:rotate(1.5deg)}}
.secret{margin:12px 0}
.secret h3{font-size:1rem;margin:0 0 6px}
.visit.sealed{border-style:dashed}
.visit.sealed .v-score b{font-family:inherit;font-size:1.6rem}

/* Mordiscos */
.biter{width:54px;height:54px;flex:none;position:relative}
.biter svg{width:100%;height:100%;overflow:visible}
.bcount{font-weight:800;font-size:.85rem;color:var(--tinta-2);min-width:58px;text-align:right}
.wbar .grow{flex:1}
.crumb{position:fixed;width:6px;height:6px;border-radius:50%;background:#C58A3A;pointer-events:none;z-index:3000;animation:crumb .8s ease-in forwards}
@keyframes crumb{to{transform:translate(var(--dx),60px);opacity:0}}

/* Deslizador */
.pv-wrap{height:150px;display:grid;place-items:center;position:relative;margin:4px 0}
.pv{font-size:108px;line-height:1;transition:filter .35s,transform .35s cubic-bezier(.3,1.6,.5,1);display:inline-block}
.pv-fx{position:absolute;inset:0;pointer-events:none}
.pv-fx span{position:absolute;font-size:22px;animation:spark .9s ease-out forwards}
@keyframes spark{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1.2);opacity:0}}
.sword{text-align:center;min-height:62px}
.sword b{display:block;font-size:2.4rem;line-height:1}
.sword span{font-weight:800;color:var(--tinta-2)}
.strack{position:relative;height:64px;margin:6px 0 2px;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none}
.srail{position:absolute;left:26px;right:26px;top:26px;height:12px;border-radius:99px}
.strack.medialuna .srail{background:linear-gradient(90deg,#F4EBD6,#F3D48A,#E3A11B,#C9780E)}
.strack.cafe .srail{background:linear-gradient(90deg,#EFE6D8,#D9BD98,#A8744A,#6B3E22)}
.strack.experiencia .srail{background:linear-gradient(90deg,#E6EEF8,#B9CFEA,#6E97CC,#1F4F8C)}
.sstop{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--carta);transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.sthumb{position:absolute;top:50%;width:56px;height:56px;border-radius:50%;background:var(--carta);box-shadow:0 6px 16px rgba(0,0,0,.25);display:grid;place-items:center;font-size:30px;transform:translate(-50%,-50%);transition:left .18s cubic-bezier(.3,1.5,.5,1)}
.strack.drag .sthumb{transition:none;transform:translate(-50%,-50%) scale(1.12)}
.strack.empty .sthumb{opacity:.55}
.strack:focus-visible .sthumb{outline:3px solid var(--azulejo)}
.slabels{display:flex;justify-content:space-between;padding:0 20px;font-weight:800;color:var(--tinta-2);font-size:.85rem}

/* Revelación */
.rv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px;max-width:560px;margin:0 auto;width:100%}
.rv-count{font-size:6rem;line-height:1;min-height:6rem}
.rv-count.pulse{animation:bounceIn .5s cubic-bezier(.3,1.7,.5,1)}
.cards{display:flex;gap:14px;justify-content:center;perspective:900px;width:100%}
.fcard{width:44%;max-width:180px;aspect-ratio:3/4;position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1)}
.fcard.flip{transform:rotateY(180deg)}
.fcard > div{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sombra)}
.fcard .front{background:var(--tinta);color:var(--papel);font-size:52px}
.fcard .front b{font-size:1rem}
.fcard .back{background:var(--manteca);color:#2A1A0F;transform:rotateY(180deg)}
.fcard .back b{font-size:3.4rem;line-height:1}
.fcard .back span{font-weight:800;font-size:.85rem}
.rv-res{animation:bounceIn .6s cubic-bezier(.3,1.7,.5,1)}
.rv-res .big{font-size:1.6rem;font-weight:800}

/* Pasaporte */
.pp-head{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px}
.pp-head h2{margin:0;font-size:1.8rem}
.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 16px}
.medal{border:0;background:var(--carta);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;font-weight:700;line-height:1.15;text-align:center;box-shadow:0 1px 0 var(--linea)}
.medal .mi{font-size:30px}
.medal.off{opacity:.45}
.medal.off .mi{filter:grayscale(1)}
.yearbtn{width:100%;border:0;border-radius:22px;padding:16px 18px;background:linear-gradient(120deg,var(--azulejo),#6C3E9E);color:#fff;font-weight:800;font-size:1.05rem;text-align:left;display:flex;align-items:center;gap:12px;margin-bottom:16px}
.yearbtn span{font-size:30px}
.country{margin:18px 0 4px;font-size:1.2rem}
.city{margin:10px 0 6px;color:var(--tinta-2);font-size:.95rem;font-weight:800}
.stamps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px}
.stampc{--ink:#7A3E14;border:3px double var(--ink);color:var(--ink);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%),var(--carta);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;transform:rotate(var(--r));animation:stampDown .5s cubic-bezier(.3,1.6,.5,1) both}
.stampc.round{border-radius:50%;aspect-ratio:1;justify-content:center}
.stampc .s-name{font-weight:800;line-height:1.1;font-size:.95rem}
.stampc .s-score{font-size:2rem;line-height:1}
.stampc .s-date{font-size:.72rem;font-weight:700;opacity:.8}
@keyframes stampDown{0%{transform:rotate(var(--r)) scale(1.7);opacity:0}60%{transform:rotate(var(--r)) scale(.94);opacity:1}100%{transform:rotate(var(--r)) scale(1)}}

/* Ruleta */
.wheel-wrap{position:relative;width:min(88vw,330px);aspect-ratio:1;margin:16px auto 10px}
.wheel-wrap svg{width:100%;height:100%;display:block}
#wheel{transform-origin:50% 50%;transition:transform 4.4s cubic-bezier(.12,.8,.18,1)}
.pointer{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:34px;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.hub{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--carta);display:grid;place-items:center;font-size:30px;box-shadow:var(--sombra)}
.pend{display:flex;align-items:center;gap:10px;background:var(--carta);border:1px solid var(--linea);border-radius:18px;padding:10px 12px}
.pend .grow{flex:1;min-width:0}
.pend .grow b{display:block;line-height:1.2}
.pend .grow span{font-size:.8rem;color:var(--tinta-2)}
.iconbtn{border:0;background:var(--papel-2);width:38px;height:38px;border-radius:12px;font-size:1rem;flex:none}
.addpend{display:flex;flex-direction:column;gap:8px;margin:12px 0 16px}

/* Resumen del año */
.story{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#fff}
.story .bars2{display:flex;gap:4px;padding:10px 16px 0}
.story .bars2 i{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.story .bars2 i.done::after,.story .bars2 i.now::after{content:"";display:block;height:100%;background:#fff}
.story .bars2 i.now::after{animation:grow 6s linear forwards}
@keyframes grow{from{width:0}to{width:100%}}
.slide{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px;animation:bounceIn .6s cubic-bezier(.3,1.5,.5,1)}
.slide .xl{font-size:clamp(4rem,22vw,6.5rem);line-height:1}
.slide h2{margin:0;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.1}
.slide p{margin:0;opacity:.85;font-size:1.05rem;max-width:22rem}
.slide .emo{font-size:84px;animation:rock 2.6s ease-in-out infinite}
.story .tapL,.story .tapR{position:absolute;top:40px;bottom:0;width:35%;z-index:1}
.story .tapL{left:0}.story .tapR{right:0;width:65%}
.story .sx{position:absolute;right:12px;top:22px;z-index:2;background:rgba(255,255,255,.2);color:#fff}

/* Medalla nueva */
.medalpop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3500;background:var(--carta);border-radius:28px;padding:22px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:medalIn .6s cubic-bezier(.3,1.7,.5,1)}
.medalpop .mi{font-size:72px;display:inline-block;animation:spinY 1.2s ease-out}
.medalpop small{display:block;font-weight:800;color:var(--tinta-2)}
.medalpop b{font-size:1.3rem}
@keyframes medalIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes spinY{from{transform:rotateY(0)}to{transform:rotateY(720deg)}}

/* ====== Edición 6 ====== */
.q-tipo{font-size:.78rem;font-weight:800;color:var(--tinta-2);margin-left:6px}
.podio{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pod{border:1px solid var(--linea);background:var(--carta);border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:8px;text-align:left}
.pod .m{font-size:22px}
.pod b{flex:1;font-size:.9rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pod .p{font-size:1.3rem}
.retos{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.reto{display:flex;align-items:center;gap:10px;background:var(--carta);border:1px solid var(--linea);border-radius:18px;padding:10px 14px}
.reto .ri{font-size:24px}
.reto .grow{flex:1;min-width:0}
.reto b{font-size:.92rem;display:block;margin-bottom:4px}
.reto .rt{height:8px;border-radius:99px;background:var(--papel-2);overflow:hidden}
.reto .rt i{display:block;height:100%;background:var(--manteca);border-radius:99px;transition:width .9s cubic-bezier(.2,.9,.3,1)}
.reto .rn{font-weight:800;color:var(--tinta-2);font-size:.85rem}
.guia{background:var(--carta);border:1px solid var(--linea);border-radius:20px;padding:12px 16px;margin:10px 0}
.guia h3{margin:0 0 6px;font-size:1rem}
.guia p{margin:0;color:var(--tinta-2);font-size:.92rem}
.guia ul{margin:4px 0 0;padding-left:18px;color:var(--tinta-2);font-size:.92rem}
.guia li{margin:3px 0}
</style>
</head>

<script>
/* ================= categorías fijas ================= */
const GROUPS = [

const FILTERS = ['grayscale(.4)', 'grayscale(.85) brightness(1.4)', 'grayscale(.45) brightness(1.2)', 'none', 'saturate(1.35)', 'saturate(1.7) brightness(1.05) drop-shadow(0 0 16px rgba(240,180,40,.9))'];

  {id:'primera', icon:'🥐', name:'Primera cata', desc:'Catar el primer lugar.', t:d=>d.n>=1},

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function today(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fdate(s){ if(!s) return ''; try{ return new Date(s+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return s; } }

/* ================= sonidos (sintetizados, sin archivos) ================= */
const Snd = {
  modo: store.get('cata:snd')||'off',   // off | fx | all
  get on(){ return this.modo!=='off'; },
  ctx:null, musica:null,
  ac(){ if(!this.on) return null; if(!this.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; this.ctx=new C(); } if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  noise(dur, type, freq, gain, sweepTo){ const c=this.ac(); if(!c) return; const b=c.createBuffer(1, Math.floor(c.sampleRate*dur), c.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2)*(Math.random()<.35?1:.35);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, c.currentTime+dur);
    const g=c.createGain(); g.gain.value=gain; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); },
  tone(freq, dur, type, gain, at){ const c=this.ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain(), t=c.currentTime+(at||0);
    o.type=type||'sine'; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain||.15,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02); },
  crunch(){ this.duck(); this.noise(.13,'bandpass',2600,.7); },
  tick(v){ this.tone(320+(v||3)*90,.06,'triangle',.12); },
  sip(){ this.noise(.45,'lowpass',1400,.35,300); },
  thud(){ this.tone(90,.18,'sine',.35); this.noise(.08,'lowpass',600,.3); },
  fanfare(){ this.duck(); [523,659,784,1047].forEach((f,i)=>this.tone(f,.28,'triangle',.14,i*.11)); },
  sad(){ [392,330,262].forEach((f,i)=>this.tone(f,.32,'sine',.12,i*.16)); },
  // Música de fondo: acordes suaves generados en el momento, sin archivos
  musicaOn(){
    if(this.modo!=='all' || this.musica) return;
    const c=this.ac(); if(!c) return;
    const master=c.createGain(); master.gain.value=.055; master.connect(c.destination);
    const delay=c.createDelay(); delay.delayTime.value=.42;
    const fb=c.createGain(); fb.gain.value=.3; delay.connect(fb); fb.connect(delay); delay.connect(master);
    const escala=[261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25];
    const paso=()=>{
      if(!this.musica) return;
      const c2=this.ac(); if(!c2) return;
      const n=escala[Math.floor(Math.random()*escala.length)];
      [n, n*1.5].forEach((f,i)=>{
        const o=c2.createOscillator(), g=c2.createGain(), t=c2.currentTime+i*.18;
        o.type='triangle'; o.frequency.value=f/ (i?2:1);
        g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.5,t+.8); g.gain.exponentialRampToValueAtTime(.0001,t+3.4);
        o.connect(g); g.connect(master); g.connect(delay); o.start(t); o.stop(t+3.6);
      });
      this.musica=setTimeout(paso, 2600+Math.random()*1600);
    };
    this.musica=setTimeout(paso,10); this.master=master;
  },
  musicaOff(){ if(this.musica){ clearTimeout(this.musica); this.musica=null; } if(this.master){ try{ this.master.gain.value=0; }catch(e){} } },
  duck(){ if(this.master) try{ const c=this.ac(); this.master.gain.cancelScheduledValues(c.currentTime); this.master.gain.setValueAtTime(.02,c.currentTime); this.master.gain.linearRampToValueAtTime(.055,c.currentTime+1.2); }catch(e){} }
};

/* ================= servidor ================= */
function run(fn, args){
  return new Promise((res, rej) => {
    if(!window.google || !google.script){ rej(new Error('Abrí la app desde su link de Google.')); return; }
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args);
  });
}
function srv(fn, ...args){
  return run(fn, [pin, ...args]).catch(e => {
    const m=(e&&e.message)||String(e);
    if(m.indexOf('PIN_INCORRECTO')>=0 || m.indexOf('SIN_PIN')>=0){ store.del('cata:pin'); pin=null; startPin(); }
    throw e;
  });
}
function setData(d){
  data = {visitas:d.visitas||[], catas:d.catas||[], pendientes:d.pendientes||[], catadores:d.catadores||data.catadores};
  loaded=true; render(); checkMedals();
}

/* ================= puntajes y secreto ================= */
function gAvg(p,key){
  if(!p) return null;
  const gus=QS.filter(q=>q.g===key&&q.tipo==='gusto').map(q=>p[q.id]).filter(x=>x>=1);
  const ofi=QS.filter(q=>q.g===key&&q.tipo==='oficio').map(q=>p[q.id]).filter(x=>x>=1);
  if(!gus.length && !ofi.length) return null;
  if(!gus.length) return avg(ofi);
  if(!ofi.length) return avg(gus);
  return avg(gus)*0.5 + avg(ofi)*0.5;   // mitad gusto, mitad oficio
}
function pScore(p){ let t=0,w=0; GROUPS.forEach(g=>{ const a=gAvg(p,g.key); if(a!=null){ t+=a*g.w; w+=g.w; } }); return w ? t/w : null; }
function catasDe(vid){ return data.catas.filter(c => c.visitaId===vid && pScore(c.puntajes)!=null); }
function sealed(v){
  if(v.revelada) return false;
  const quienes=catasDe(v.id).map(c=>c.catador).filter(inPareja);
  return quienes.length>0 && quienes.length<data.catadores.length;
}
function faltan(v){ const q=catasDe(v.id).map(c=>c.catador); return data.catadores.filter(n=>q.indexOf(n)<0); }
function scores(vid){
  const cs=catasDe(vid), out={catas:cs, overall:null, g:{}};
  GROUPS.forEach(g=>out.g[g.key]=null);
  if(!cs.length) return out;
  out.overall=avg(cs.map(c=>pScore(c.puntajes)));
  GROUPS.forEach(g=>{ const v=cs.map(c=>gAvg(c.puntajes,g.key)).filter(x=>x!=null); out.g[g.key]=v.length?avg(v):null; });
  return out;
}
function openVisits(){ return data.visitas.filter(v=>!sealed(v) && catasDe(v.id).length); }
function pairDiff(v){ const cs=catasDe(v.id).filter(c=>inPareja(c.catador)); if(cs.length<2) return null; const s=cs.map(c=>pScore(c.puntajes)); return Math.abs(s[0]-s[1]); }
function money(n){ return n==null||n==='' ? '' : '$'+Number(n).toLocaleString('es-AR'); }
function parseMoney(t){ t=String(t||'').replace(/[^\d.,]/g,''); if(!t) return null; t=t.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.'); const n=parseFloat(t); return isNaN(n)?null:n; }
function valor(v){
  const s=scores(v.id).overall, tot=(Number(v.precioMedialuna)||0)+(Number(v.precioCafe)||0);
  return (s==null||!tot) ? null : s/tot*1000;   // puntos por cada mil pesos
}
function datosLinea(v){
  const a=[];
  if(TAMANOS[v.tamano]) a.push('Medialuna '+TAMANOS[v.tamano][1].toLowerCase());
  if(ORIGENES[v.origen] && v.origen!=='nose') a.push(ORIGENES[v.origen][0]+' '+ORIGENES[v.origen][1].toLowerCase());
  if(v.precioMedialuna!=null && v.precioMedialuna!=='') a.push('🥐 '+money(v.precioMedialuna));
  if(v.precioCafe!=null && v.precioCafe!=='') a.push('☕ '+money(v.precioCafe));
  const q=valor(v); if(q!=null) a.push('💸 '+fmt(q)+' puntos cada $1.000');
  return a.join(', ');
}
function mapsLink(v){
  if(v.linkMaps) return v.linkMaps;
  if(v.lat!=null && v.lng!=null) return 'https://www.google.com/maps/search/?api=1&query='+v.lat+','+v.lng;
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([v.lugar,v.direccion,v.ciudad].filter(Boolean).join(', '));
}
function parseLoc(t){
  if(!t) return null;
  const pats=[/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/, /@(-?\d+\.\d+),\s*(-?\d+\.\d+)/, /^\s*\(?\s*(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)\s*\)?\s*$/];
  for(const p of pats){ const m=t.match(p); if(m){ const a=parseFloat(m[1]), b=parseFloat(m[2]); if(Math.abs(a)<=90&&Math.abs(b)<=180) return {lat:a,lng:b}; } }
  return null;
}

/* ================= logros ================= */
function statsFor(list){
  const d={n:list.length, ciudades:new Set(list.map(v=>v.ciudad).filter(Boolean)).size, paises:new Set(list.map(v=>v.pais).filter(Boolean)).size,
    minDiff:null, maxDiff:null, best:null, worst:null, early:false, streak:0, fotos:0, casera:false};
  const weeks=new Set();
  list.forEach(v=>{
    const s=scores(v.id).overall, df=pairDiff(v);
    if(s!=null){ d.best=d.best==null?s:Math.max(d.best,s); d.worst=d.worst==null?s:Math.min(d.worst,s); }
    if(df!=null){ d.minDiff=d.minDiff==null?df:Math.min(d.minDiff,df); d.maxDiff=d.maxDiff==null?df:Math.max(d.maxDiff,df); }
    if(v.creadoEn && new Date(v.creadoEn).getHours()<9) d.early=true;
    d.fotos+=(v.fotos||[]).length;
    if(v.origen==='casera') d.casera=true;
    if(v.fecha){ const t=new Date(v.fecha+'T12:00:00').getTime(); weeks.add(Math.floor((t/864e5+3)/7)); }
  });
  const w=[...weeks].sort((a,b)=>a-b); let run=0, best=0;
  w.forEach((x,i)=>{ run = i && x===w[i-1]+1 ? run+1 : 1; best=Math.max(best,run); });
  d.streak=best;
  return d;
}
function unlocked(){ const d=statsFor(openVisits()); return MEDALS.filter(m=>m.t(d)).map(m=>m.id); }
function checkMedals(){
  const now=unlocked(), raw=store.get('cata:medals');
  if(raw==null){ store.set('cata:medals', JSON.stringify(now)); return; }
  let prev=[]; try{ prev=JSON.parse(raw); }catch(e){}
  const nuevas=now.filter(id=>prev.indexOf(id)<0);
  store.set('cata:medals', JSON.stringify(now));
  nuevas.forEach(id=>medalQueue.push(id));
  showMedals();
}
function showMedals(){
  if(overlayBusy || wiz || !medalQueue.length || !$('#reveal').classList.contains('hidden')) return;
  const m=MEDALS.find(x=>x.id===medalQueue.shift()); if(!m) return;
  overlayBusy=true;
  const el=document.createElement('div'); el.className='medalpop';
  el.innerHTML='<span class="mi">'+m.icon+'</span><small>¡Nuevo logro!</small><b>'+esc(m.name)+'</b><div class="note-muted">'+esc(m.desc)+'</div>';
  document.body.appendChild(el); Snd.fanfare(); buzz([20,40,20]); confetti(5, ['🏅','✨',m.icon]);
  setTimeout(()=>{ el.remove(); overlayBusy=false; showMedals(); }, 2800);
}

/* ================= clave ================= */
let pinBuf='', pinMode='enter', pinFirst='';
function startPin(){
  run('estado',[]).then(st=>{
    pinMode = st.tienePin ? 'enter' : 'create1';
    showPin();
  }).catch(e=>{ $('#v-libreta').innerHTML='<div class="empty">🥲 '+esc(e.message||e)+'</div>'; });
}
function showPin(){
  $('#pin').classList.remove('hidden'); pinBuf=''; drawPin();
  $('#pin-title').textContent = pinMode==='enter' ? 'Clave de la pareja' : pinMode==='create1' ? 'Creen su clave' : 'Repetila';
  $('#pin-sub').textContent = pinMode==='enter' ? '' : pinMode==='create1' ? 'De 4 a 6 números. La van a usar los dos.' : 'Para estar seguros de que quedó bien.';
  $('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>'<button data-action="pin-key" data-k="'+k+'">'+k+'</button>').join('');
}
function drawPin(){ const n=Math.max(4,pinBuf.length); let h=''; for(let i=0;i<n;i++) h+='<i class="'+(i<pinBuf.length?'on':'')+'"></i>'; $('#pin-dots').innerHTML=h; }
function pinFail(msg){ pinBuf=''; drawPin(); const d=$('#pin-dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); buzz([30,40,30]); $('#pin-msg').textContent=msg; }
function pinOk(p){ pin=p; store.set('cata:pin',p); $('#pin').classList.add('hidden'); $('#pin-msg').textContent=''; buzz(20); Snd.fanfare(); boot(); }
function submitPin(){
  if(pinBuf.length<4){ $('#pin-msg').textContent='De 4 a 6 números.'; return; }
  const cand=pinBuf;
  if(pinMode==='create1'){ pinFirst=cand; pinMode='create2'; showPin(); return; }
  if(pinMode==='create2'){
    if(cand!==pinFirst){ pinMode='create1'; showPin(); pinFail('No coincidieron. Empecemos de nuevo.'); return; }
    $('#pin-msg').textContent='Guardando…';
    run('crearPin',[cand]).then(()=>pinOk(cand)).catch(e=>{
      const m=(e&&e.message)||''; pinMode='enter'; showPin();
      pinFail(m.indexOf('YA_EXISTE')>=0 ? 'Ya había una clave creada. Ingresala.' : m);
    });
    return;
  }
  $('#pin-msg').textContent='Probando…';
  run('verificarPin',[cand]).then(()=>pinOk(cand)).catch(e=>{
    const m=(e&&e.message)||'';
    pinFail(m.indexOf('BLOQUEADO')>=0 ? 'Demasiados intentos. Esperá diez minutos.' : m.indexOf('PIN_INCORRECTO')>=0 ? 'Esa no es. Probá de nuevo.' : m);
  });
}

function thumbHTML(v){ return v.fotos && v.fotos.length ? '<div class="thumb" style="background-image:url(\''+fotoUrl(v.fotos[0])+'\')"></div>' : '<div class="thumb">🥐</div>'; }
function cities(list){ const m={}; (list||data.visitas).forEach(v=>{ if(v.ciudad) m[v.ciudad]=(m[v.ciudad]||0)+1; }); return Object.keys(m).sort((a,b)=>m[b]-m[a]); }
function seenReveals(){ try{ return JSON.parse(store.get('cata:reveal')||'[]'); }catch(e){ return []; } }
function markRevealed(id){ const s=seenReveals(); if(s.indexOf(id)<0){ s.push(id); store.set('cata:reveal',JSON.stringify(s)); } }
function pendingReveals(){
  if(!yo || !inPareja(yo)) return [];
  const seen=seenReveals();
  return data.visitas.filter(v=>seen.indexOf(v.id)<0 && catasDe(v.id).filter(c=>inPareja(c.catador)).length===data.catadores.length);
}

  }

  const ranked=all.slice().sort((a,b)=>b.s.overall-a.s.overall);

  h+=desafiosHTML(open);
  h+='<div class="stats"><div class="stat"><b class="display">'+pool.length+'</b><span>'+(pool.length===1?'lugar catado':'lugares catados')+'</span></div><div class="stat"><b class="display">'+fmt(ml.length?avg(ml):null)+'</b><span>🥐 promedio</span></div><div class="stat"><b class="display">'+fmt(cf.length?avg(cf):null)+'</b><span>☕ promedio</span></div></div>';
  const per={};

  else all.sort((a,b)=>{ const x=key(a),y=key(b); if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1; return y-x; });
  h+='<div class="list">'+all.map((x,i)=>{ const v=x.v, s=x.s, main=key(x);

      '<div class="v-score"><b class="display">'+fmt(main)+'</b><span>'+esc(verdict(main))+'</span></div></button>'; }).join('')+'</div>';

  if(!mapFitted && pts.length){ fitTo(''); mapFitted=true; }
}
function fitTo(c){

function spin(){
  const P=data.pendientes.slice(0,12), n=P.length; if(n<2||spinning) return;
  spinning=true; $('#spinbtn').disabled=true;
  const i=Math.floor(Math.random()*n), a=360/n, want=(360-(i*a+a/2))%360, cur=((wheelRot%360)+360)%360;
  wheelRot += 360*6 + ((want-cur+360)%360) + (Math.random()*a*.5 - a*.25);
  const w=$('#wheel'); w.style.transform='rotate('+wheelRot+'deg)';
  let t=0, gap=45; (function tk(){ Snd.tick(3); buzz(4); t+=gap; gap*=1.09; if(t<4000) setTimeout(tk,gap); })();
  setTimeout(()=>{
    spinning=false; const p=P[i]; Snd.fanfare(); buzz([30,50,30]); confetti(5);
    detailId=null;
    showSheet(phead('¡La ruleta habló!')+'<div class="pbody" style="text-align:center"><div style="font-size:64px">🎯</div><h2 class="display" style="margin:4px 0;font-size:2rem">'+esc(p.lugar)+'</h2><p class="note-muted">'+esc(p.ciudad||p.direccion||'')+'</p><div class="actions" style="justify-content:center"><button class="btn gold" data-action="pend-go" data-id="'+esc(p.id)+'">🥐 Catar acá</button><a class="btn blue" href="'+esc(mapsLink(p))+'" target="_blank" rel="noopener">Cómo llegar</a></div></div>');
    renderRuleta();
  }, reduced()?300:4500);
}

function compress(file){
  return new Promise((ok,ko)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const r=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*r); c.height=Math.round(img.naturalHeight*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg',.8).split(',')[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error('img')); }; img.src=url; });
}
function uploadPhoto(file){
  const b=$('#add-photo'); if(b){ b.disabled=true; b.innerHTML='Subiendo…'; }
  compress(file).then(b64=>srv('subirFoto',b64)).then(id=>{ if(wiz){ wiz.visita.fotos.push(id); saveDraft(); drawPhotos(); Snd.thud(); } }).catch(()=>{ toast('No se pudo subir la foto.'); drawPhotos(); });
}
function floatEmoji(el,e){ if(reduced()) return; const r=el.getBoundingClientRect(), s=document.createElement('span'); s.className='float'; s.textContent=e; s.style.left=(r.left+r.width/2-13)+'px'; s.style.top=r.top+'px'; document.body.appendChild(s); setTimeout(()=>s.remove(),950); }
function resumen(p){ const r=n=>n==null?null:Math.round(n*100)/100; return {final:r(pScore(p)), medialuna:r(gAvg(p,'medialuna')), cafe:r(gAvg(p,'cafe')), lugar:r(gAvg(p,'experiencia'))}; }

function finish(){
  const w=wiz;
  if(w.mode==='place'){
    if(w.visita.lat==null){ toast('Primero ubicá el lugar.'); return; }
    $('#stage').innerHTML='<div class="scr"><div class="saving"><div class="mug"></div>Guardando…</div></div>'; $('#wfoot').innerHTML='';
    srv('guardarTodo',w.visita,[],'').then(d=>{ setData(d); mapFitted=false; closeWiz(); toast('Ubicada en el mapa 📍'); }).catch(()=>{ toast('No se pudo guardar.'); drawStep(false); });
    return;
  }
  const cata={catador:w.catador, puntajes:w.puntajes, nota:w.nota, resumen:resumen(w.puntajes)};
  $('#stage').innerHTML='<div class="scr"><div class="saving"><div class="mug"></div>Sumando puntajes…</div></div>'; $('#wfoot').innerHTML=''; Snd.sip();
  srv('guardarTodo',w.visita,[cata],w.pendienteId||'').then(d=>{ w.saved=true; clearDraft(); setData(d); mapFitted=false; showVerdict(); })
    .catch(()=>{ $('#stage').innerHTML='<div class="scr"><div class="saving">🥲<span>No se pudo guardar. La cata quedó en el celu.</span><button class="btn gold" data-action="retry">Reintentar</button></div></div>'; });
}
function showVerdict(){
  const w=wiz, p=w.puntajes, s=pScore(p), v=data.visitas.find(x=>x.id===w.visita.id)||w.visita;
  const fal=faltan(v).filter(n=>n!==w.catador), both=inPareja(w.catador) && !fal.length && catasDe(v.id).filter(c=>inPareja(c.catador)).length===data.catadores.length;
  let h='<div class="verdict"><small>Veredicto de '+esc(w.catador)+' en '+esc(v.lugar)+'</small><div class="bigscore display" id="count">0,0</div><span class="vword">'+esc(verdict(s))+'</span><div class="bars">'+
    GROUPS.map(g=>{ const a=gAvg(p,g.key); return '<div class="bar '+g.key+'"><div class="l"><span>'+g.icon+' '+g.label+'</span><span>'+fmt(a)+'</span></div><div class="t"><i data-w="'+(a?a/5*100:0)+'"></i></div></div>'; }).join('')+'</div>';
  if(fal.length && inPareja(w.catador)) h+='<div class="pareja">🙈 Tu puntaje queda en secreto hasta que cate '+esc(fal.join(' y '))+'.</div>';
  h+='</div>';
  $('#stage').innerHTML='<div class="scr">'+h+'</div>';
  $('#wfoot').innerHTML = both ? '<span></span><button class="btn gold" data-action="go-reveal" data-id="'+esc(v.id)+'">🎁 ¡A la revelación!</button>'
    : fal.length ? '<button class="btn link" data-action="wiz-close">Cata en su celu</button><button class="btn gold" data-action="next-turn" data-n="'+esc(fal[0])+'">Le toca a '+esc(fal[0])+' 🥐</button>'
    : '<span></span><button class="btn gold" data-action="wiz-close">Ir a la libreta 📒</button>';
  const el=$('#count'), target=s||0, t0=performance.now(), dur=reduced()?1:1100;
  (function tick(t){ const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=(target*e).toFixed(1).replace('.',','); if(k<1) requestAnimationFrame(tick); else { buzz([20,40,60]); if(s!=null&&s<2) Snd.sad(); else Snd.fanfare(); } })(t0);
  requestAnimationFrame(()=>setTimeout(()=>document.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%'),80));
  confetti(s);
}
function confetti(score, custom){
  if(reduced()) return;
  const ems=custom || (score!=null&&score<2?['🥲','☕','🥐']:['🥐','☕','✨','🥐','🧈']);
  for(let i=0;i<30;i++){ const s=document.createElement('span'); s.className='confetti'; s.textContent=ems[i%ems.length];
    s.style.left=(Math.random()*100)+'vw'; s.style.animationDuration=(1.4+Math.random()*1.3)+'s'; s.style.animationDelay=(.3+Math.random()*.5)+'s'; s.style.fontSize=(18+Math.random()*22)+'px';
    document.body.appendChild(s); setTimeout(()=>s.remove(),3400); }
}

/* ================= eventos ================= */
document.addEventListener('click', ev=>{
  const t=ev.target.closest('[data-action]'); if(!t) return; const a=t.dataset.action;
  if(a==='pin-key'){ const k=t.dataset.k; if(k==='⌫') pinBuf=pinBuf.slice(0,-1); else if(k==='✓'){ submitPin(); return; } else if(pinBuf.length<6) pinBuf+=k; buzz(5); drawPin(); $('#pin-msg').textContent=''; return; }
  if(a==='tab'){ tab=t.dataset.tab; document.querySelectorAll('nav .tab').forEach(b=>b.classList.toggle('on',b===t)); document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+tab)); window.scrollTo(0,0);
    if(tab==='mapa') renderMapa(); if(tab==='pasaporte') renderPasaporte(true); if(tab==='ruleta') renderRuleta(); }
  else if(a==='snd'){
    Snd.modo = Snd.modo==='off' ? 'fx' : Snd.modo==='fx' ? 'all' : 'off';
    store.set('cata:snd',Snd.modo); render();
    if(Snd.modo==='fx'){ Snd.crunch(); toast('Efectos prendidos 🔊'); }
    else if(Snd.modo==='all'){ Snd.musicaOn(); Snd.fanfare(); toast('Música y efectos 🎵'); }
    else { Snd.musicaOff(); toast('Silencio 🔇'); }
  }
  else if(a==='new') startNew(null);
  else if(a==='open') openDetail(t.dataset.id);
  else if(a==='close') closeSheet();
  else if(a==='who') openWho();
  else if(a==='guia') openGuia();
  else if(a==='pick-who'){ yo=t.dataset.n; store.set('cata:yo',yo); closeSheet(); render(); toast('¡Hola, '+yo+'! 🥐'); if(!store.get('cata:guia')) setTimeout(openGuia,600); }
  else if(a==='new-who'){ const n=($('#who-new').value||'').trim(); if(!n) return; yo=n; store.set('cata:yo',yo); closeSheet(); render(); toast('Bienvenida la nueva voz del jurado, '+n+' 🥐'); if(!store.get('cata:guia')) setTimeout(openGuia,600); }
  else if(a==='sort'){ sortBy=t.dataset.sort; renderLibreta(); }
  else if(a==='city'){ city=t.dataset.c; renderLibreta(); }
  else if(a==='mapcity'){ mapCity=t.dataset.c; renderMapa(); fitTo(mapCity); }
  else if(a==='add-cata') startAdd(t.dataset.id, t.dataset.n);
  else if(a==='locate') startPlace(t.dataset.id);
  else if(a==='draft-go'){ const d=loadDraft(); if(d){ wiz=d; wiz.results=[]; openWiz(); } }
  else if(a==='draft-drop'){ clearDraft(); renderLibreta(); }
  else if(a==='reveal') openReveal(t.dataset.id);
  else if(a==='reveal-close') closeReveal();
  else if(a==='force-reveal'){ const v=data.visitas.find(x=>x.id===t.dataset.id); if(!v||!confirm('¿Revelar esta cata aunque falte la del otro?')) return; const nv=Object.assign({},v,{revelada:true}); srv('guardarTodo',nv,[],'').then(d=>{ setData(d); toast('Revelada 👀'); }).catch(()=>toast('No se pudo revelar.')); }
  else if(a==='medal'){ const m=MEDALS.find(x=>x.id===t.dataset.id); if(m) toast(m.icon+' '+m.name+': '+m.desc); }
  else if(a==='story') openStory();
  else if(a==='story-close') closeStory();
  else if(a==='story-next'){ if(storyIdx<storySlides.length-1){ storyIdx++; drawStory(); Snd.tick(4); } else closeStory(); }
  else if(a==='story-prev'){ if(storyIdx>0){ storyIdx--; drawStory(); } }
  else if(a==='spin') spin();
  else if(a==='add-pend') addPend();
  else if(a==='pend-go'){ const p=data.pendientes.find(x=>x.id===t.dataset.id); if(p) startNew(p); }
  else if(a==='pend-del'){ const p=data.pendientes.find(x=>x.id===t.dataset.id); if(p && confirm('¿Sacar «'+p.lugar+'» de pendientes?')) srv('borrarPendiente',p.id).then(setData).catch(()=>toast('No se pudo borrar.')); }
  else if(a==='delete'){
    const v=data.visitas.find(x=>x.id===t.dataset.id);
    if(v&&confirm('¿Borrar «'+v.lugar+'» con todas sus catas y fotos? No se puede deshacer.')){ t.disabled=true; srv('borrarVisita',v.id).then(d=>{ closeSheet(); setData(d); toast('Visita borrada.'); }).catch(()=>{ t.disabled=false; toast('No se pudo borrar.'); }); }
  }
  /* cata */
  else if(a==='wiz-close'){ if(wiz && !wiz.saved && wiz.mode!=='place' && !confirm('¿Salir? La cata queda guardada en el celu para seguirla después.')) return; closeWiz(); }
  else if(a==='wiz-who'){ wiz.catador=t.dataset.n; document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b===t)); saveDraft(); }
  else if(a==='here') geoHere();
  else if(a==='geo-search') geoSearch();
  else if(a==='geo-pick'){ const r=wiz.results[+t.dataset.i]; if(!r) return; Object.assign(wiz.visita,{lat:r.lat,lng:r.lng,ciudad:r.ciudad,pais:r.pais,direccion:r.direccion}); $('#w-busq').value=r.direccion; $('#w-res').innerHTML=''; geoStatus(); saveDraft(); buzz(15); Snd.tick(5); }
  else if(a==='next'){ const key=stepsFor(wiz)[wiz.step]; if(key==='lugar' && wiz.mode!=='place' && !wiz.visita.lugar.trim()){ toast('¿Cómo se llama el lugar?'); const i=$('#w-lugar'); if(i) i.focus(); return; } go(1); }
  else if(a==='back') go(-1);
  else if(a==='skip'){ delete wiz.puntajes[stepsFor(wiz)[wiz.step]]; go(1); }
  else if(a==='dato'){ const f=t.dataset.f; wiz.visita[f]=t.dataset.k; t.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('sel',b===t)); floatEmoji(t, (f==='tamano'?TAMANOS:ORIGENES)[t.dataset.k][0]); buzz(12); if(t.dataset.k==='freezer') Snd.sad(); else Snd.tick(4); saveDraft(); }
  else if(a==='add-photo'){ const fp=$('#filepick'); fp.value=''; fp.click(); }
  else if(a==='rm-photo'){ wiz.visita.fotos.splice(+t.dataset.i,1); drawPhotos(); saveDraft(); }
  else if(a==='retry') finish();
  else if(a==='next-turn'){ const n=t.dataset.n, v=wiz.visita; wiz={mode:'add', step:0, catador:n, puntajes:{}, nota:'', results:[], visita:v}; lastBites=-1; drawStep(false); }
  else if(a==='go-reveal'){ const id=t.dataset.id; $('#wiz').classList.add('hidden'); document.body.style.overflow=''; wiz=null; openReveal(id); }
});
document.addEventListener('input', ev=>{
  if(!wiz) return; const k=ev.target.dataset&&ev.target.dataset.w; if(!k) return;
  if(k==='lugar') wiz.visita.lugar=ev.target.value; else if(k==='nota') wiz.nota=ev.target.value;
  else if(k==='precioMedialuna'||k==='precioCafe') wiz.visita[k]=parseMoney(ev.target.value);
  saveDraft();
});
document.addEventListener('keydown', ev=>{
  if(ev.key==='Enter' && ev.target.id==='w-busq'){ ev.preventDefault(); geoSearch(); }
  if(ev.key==='Escape' && sheetOpen) closeSheet();
});
$('#filepick').addEventListener('change', ev=>{ const f=ev.target.files&&ev.target.files[0]; if(f) uploadPhoto(f); });

/* ================= arranque ================= */
function boot(){
  refresh().then(()=>{ if(!yo) openWho(); else if(!store.get('cata:guia')) openGuia(); }).catch(e=>{ const m=(e&&e.message)||''; if(m.indexOf('PIN')<0) $('#v-libreta').innerHTML='<div class="empty">🥲 '+esc(m)+'</div>'; });
}
document.addEventListener('pointerdown', function arranque(){ if(Snd.modo==='all') Snd.musicaOn(); document.removeEventListener('pointerdown',arranque); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') Snd.musicaOff(); else if(Snd.modo==='all') Snd.musicaOn(); });
yo=store.get('cata:yo'); pin=store.get('cata:pin');
if(pin) boot(); else startPin();
setInterval(()=>{ if(pin && document.visibilityState==='visible' && !wiz && !spinning) refresh().catch(()=>{}); }, 30000);
document.addEventListener('visibilitychange', ()=>{ if(pin && document.visibilityState==='visible' && !wiz) refresh().catch(()=>{}); });
</script>
